name: Windows desktop build

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "requirements-build.txt"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils perl python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-zlib
      - name: Build pinned FFmpeg sources
        shell: msys2 {0}
        run: /usr/bin/python tools/build_ffmpeg.py
      - name: Install application dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install -e .
      - name: Test bundled encoder and GUI
        run: python tools/check.py
      - name: Package desktop application
        run: python tools/package.py
      - name: Smoke test frozen executable
        run: python tools/check.py --frozen
      - uses: actions/upload-artifact@v4
        with:
          name: PNG-to-WebM-windows-x64-unsigned
          path: |
            dist/PNG-to-WebM-windows-x64.zip
            dist/PNG-to-WebM-windows-x64.zip.sha256
          if-no-files-found: error
